<!doctype html>
<html lang="en">
    <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Booking Home Page</title>
	<link rel="icon" href="./Images/favicon.png">
	<link rel="stylesheet" href="./Test Booking Home Style 1.0.css">
	<script src="./Test Booking Home Script 1.0.js"></script>
    </head>









    <body>
	<header>
		<img id="siteLogo" src="./Images/paradise_logo-01.png"></img>
	</header>





	<nav>
		<ul>
			<li>Home</li>
			<li>Rooms</li>
			<li>About Us</li>
			<li>Contact</li>
			<li>Book a Room</li>
		</ul>
	</nav>





	<main>
		<p>filler main text</p>
		<form id="bookingForm">
			<select id="roomSelect">
				<option value="Tropical">Tropical</option>
				<option value="Cofresi">Cofresi Palm Beach & Spa Resort</option>
				<option value="Residence">Residence Suites</option>
				<option value="CrownS">Crown Suites</option>
				<option value="Presidential">Presidential Suites</option>
				<option value="RoyalS">Royal Suites</option>
				<option value="Sunrise">Sunrise Suites</option>
				<option value="CrownV">Crown Villas</option>
				<option value="RoyalV">The Royal Villas</option>
			</select>
			<fieldset id="dateSelect">
				<legend>Select Dates:</legend>
				<input type="number" id="yearSelect" max="9999" min="2026" step="1">
				<select id="monthSelect">
					<option value="00">January</option>
					<option value="01">Febuary</option>
					<option value="02">March</option>
					<option value="03">April</option>
					<option value="04">May</option>
					<option value="05">June</option>
					<option value="06">July</option>
					<option value="07">August</option>
					<option value="08">September</option>
					<option value="09">October</option>
					<option value="10">November</option>
					<option value="11">December</option>
				</select>
				<input type="checkbox" name="day1" value="1">
				<input type="checkbox" name="day2" value="2">
				<input type="checkbox" name="day3" value="3">
				<input type="checkbox" id="currentDay" name="day4" value="4">
				<input type="checkbox" name="day5" value="5">
			</fieldset>
			<input type="number" id="guestSelect" max="50" min="1" step="1">
		</form>
		<p id="ok">text</p>
	</main>





	<footer>
		<ul>
			<li>Home</li>
			<li>Rooms</li>
			<li>About Us</li>
			<li>Contact</li>
			<li>Book a Room</li>
		</ul>
	</footer>
    </body>
</html>
